<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      padding: 15px;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1C1C1E;
      color: #F5F5F7;
      letter-spacing: -0.015em;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .brand {
      font-weight: 600;
      font-size: 14.5px;
      color: #F5F5F7;
    }
    .status {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(48, 209, 88, 0.16);
      color: #30D158;
      font-weight: 600;
    }
    .status.offline {
      background: rgba(255, 69, 58, 0.16);
      color: #FF453A;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      font-size: 12.5px;
      color: #98989D;
    }
    select, input[type="text"] {
      background: #2C2C2E;
      border: 1px solid rgba(255,255,255,0.12);
      color: #F5F5F7;
      padding: 5px 8px;
      border-radius: 7px;
      font-size: 12px;
      outline: none;
    }
    .quick-box {
      margin-top: 10px;
      display: flex;
      gap: 6px;
    }
    .quick-box input { flex: 1; }
    .btn {
      width: 100%;
      margin-top: 9px;
      padding: 7px 12px;
      border-radius: 7px;
      border: none;
      background: #0A84FF;
      color: #fff;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
    }
    .btn-sec {
      background: #2C2C2E;
      border: 1px solid rgba(255,255,255,0.12);
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="brand">Loadin</span>
    <span class="status" id="conn-status">확인 중...</span>
  </div>
  <div class="row">
    <span>다운로드 자동 연결</span>
    <input type="checkbox" id="toggle-intercept" checked />
  </div>
  <div class="row">
    <span>최소 파일 크기</span>
    <select id="min-size">
      <option value="0" selected>모든 파일</option>
      <option value="1">1 MB 이상</option>
      <option value="10">10 MB 이상</option>
      <option value="50">50 MB 이상</option>
    </select>
  </div>
  <div class="quick-box">
    <input type="text" id="direct-url" placeholder="주소 입력..." />
    <button class="btn" id="btn-send" style="width:auto;margin-top:0">추가</button>
  </div>
  <button class="btn btn-sec" id="btn-open-ui">Loadin 열기</button>
  <script src="popup.js"></script>
</body>
</html>
