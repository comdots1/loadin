<!DOCTYPE html>
<html lang="ko" data-theme="black">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 페이지를 찾을 수 없습니다 | Loadin</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="error-page-body">
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <main class="error-container">
    <div class="error-card glass-panel">
      <div class="error-badge">404 NOT FOUND</div>
      <h1 class="error-title">세그먼트 연결 실패</h1>
      <p class="error-desc">
        요청하신 페이지 또는 리소스를 찾을 수 없습니다.<br>
        URL이 변경되었거나 일시적으로 사용할 수 없는 상태입니다.
      </p>
      <div class="error-actions">
        <a href="/" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          메인 페이지로 이동
        </a>
        <a href="/#download" class="btn btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Loadin 다운로드
        </a>
      </div>
    </div>
  </main>
</body>
</html>
