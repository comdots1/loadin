<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="loadinGrad" x1="256" y1="20" x2="256" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38A3FF"/>
      <stop offset="100%" stop-color="#0058D6"/>
    </linearGradient>

    <!-- Glass Glow -->
    <radialGradient id="glassGlow" cx="256" cy="100" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for Arrow -->
    <filter id="arrowShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#002B7A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="114" fill="url(#loadinGrad)"/>
  
  <!-- Subtle Glass Highlight Overlay -->
  <rect x="20" y="20" width="472" height="240" rx="114" fill="url(#glassGlow)"/>

  <!-- Border Stroke Highlight -->
  <rect x="20" y="20" width="472" height="472" rx="114" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="6"/>

  <!-- Download Arrow & Dock Bar -->
  <g filter="url(#arrowShadow)">
    <!-- Vertical Shaft -->
    <line x1="256" y1="128" x2="256" y2="307" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round"/>
    
    <!-- Arrow Head Wings -->
    <polyline points="174,235 256,307 338,235" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Bottom Dock Bar -->
    <line x1="143" y1="378" x2="369" y2="378" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round"/>
  </g>
</svg>
